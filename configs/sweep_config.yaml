method: random
name: "partA_cnn_sweep"

# Script to run for each sweep trial
program: partA/train.py

metric:
  name: val_acc
  goal: maximize

parameters:
  # 1. Conv channel configurations
  conv_channels:
    values:
      - [32, 64, 128, 128, 256]
      - [32, 64, 128, 256, 256]
      - [64, 64, 128, 256, 256]

  # 2. Activation function
  activation:
    values:
      - relu
      - gelu
      - silu

  # 3. Optimizer
  optimizer:
    values:
      - adam
      - sgd

  # 4. Learning rate
  learning_rate:
    values:
      - 0.001
      - 0.0005
      - 0.0001

  # 5. Weight decay
  weight_decay:
    values:
      - 0.0005
      - 0.0001

  # 6. Batch size
  batch_size:
    values:
      - 32
      - 64

  # 7. Dropout rate
  dropout:
    values:
      - 0.2
      - 0.4

  # 8. Batch normalization on/off
  use_batchnorm:
    values:
      - true
      - false

  # 9. Data augmentation on/off
  use_augmentations:
    values:
      - true
      - false

  # 10. Number of epochs (same for all runs, but set via sweep)
  num_epochs:
    value: 10
